name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract ZIP
        run: |
          unzip -o siraj-arts-printing-hub.zip
          # ZIP ke andar ka folder bahar lao
          mv */*./ 2>/dev/null || true
          mv */*/*./ 2>/dev/null || true
          ls
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - run: npm install
      - run: npm run build
      - run: npm install @capacitor/cli @capacitor/core @capacitor/android
      - run: npx cap init "Siraj Arts" com.sirajarts.app --web-dir=dist
      - run: npx cap add android
      - run: npx cap copy android
      - run: cd android && chmod +x gradlew &&./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Siraj-Arts-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

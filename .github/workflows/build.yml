name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o siraj-arts-printing-hub.zip
      - run: cp -r siraj-arts-printing-hub/*. || cp -r */*. || true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - run: npm install
      - run: npm run build
      - run: npm i @capacitor/cli @capacitor/core @capacitor/android
      - run: npx cap init "Siraj Arts" com.sirajarts.app --web-dir=dist || true
      - run: npx cap add android
      - run: npx cap copy android
      - run: cd android && chmod +x gradlew &&./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Siraj-Arts-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
